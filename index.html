<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorfly Studio</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet" />
  </head>

  <body>
    <header>
      <h1>Colorfly Studio</h1>
      <p>Genera tu paleta de colores con combinaciones aleatorias.</p>
    </header>

    <main>
      <section class="controles" aria-labelledby="titulo-controles">
        <h2 id="titulo-controles">Configurá tu paleta</h2>

        <fieldset>
          <legend>Opciones de la paleta</legend>

          <label for="cantidad-colores">Cantidad de colores:</label>

          <select id="cantidad-colores">
            <option value="6">6 colores</option>
            <option value="8" selected>8 colores</option>
            <option value="9">9 colores</option>
          </select>

          <label for="formato-color">Formato del color:</label>

          <select id="formato-color">
            <option value="hex" selected>HEX</option>
            <option value="hsl">HSL</option>
          </select>
        </fieldset>

        <button id="boton-generar" type="button">Generar paleta</button>

        <p id="mensaje" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="titulo-paleta">
        <h2 id="titulo-paleta">Tu paleta</h2>

        <div id="paleta" class="paleta"></div>
      </section>
    </main>

    <footer>
      <p>Proyecto Integrador Módulo 1 - 2026</p>
    </footer>

    <script src="./source/app.js"></script>
  </body>
</html>
